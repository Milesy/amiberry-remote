[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "amiberry-remote"
version = "0.1.0"
description = "Drive Amiberry through its remote-control socket: keys, pointer, screenshots, memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow"]

[project.scripts]
amiberry-remote = "amiberry_remote.cli:main"

[tool.setuptools]
packages = ["amiberry_remote"]
